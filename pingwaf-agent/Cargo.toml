[package]
name = "pingwaf-agent"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "PingWAF data-plane agent: connects to the control plane over gRPC, caches WAF rules locally with disk persistence, and ships logs and metrics back."

[features]
# Exposes `set_agent_instance` and `ControlPlaneClient::pop_log` so
# downstream crates can install a never-connecting agent in tests.
test-util = []
# TLS backend passthrough: the upstream provider needs a TLS stack. The
# host binary enables exactly one of these via its own feature chain.
default = ["openssl"]
openssl = ["pingap-upstream/openssl"]
tls-rustls = ["pingap-upstream/tls-rustls"]

[dependencies]
pingwaf-proto = { path = "../pingwaf-proto" }
# Self-accounting for configuration sync; atomics only, no allocator hook.
pingwaf-profiler = { path = "../pingwaf-profiler" }
pingap-cache = { workspace = true }
# Host-keyed caches must key on the same canonical form the request path
# produces (`pingap_core::get_host` → `normalize_host`).
pingap-core = { workspace = true }
# The heartbeat reports upstream backend health via `UpstreamProvider::
# healthy_status()`; the provider itself is injected by the binary that
# owns the proxy, mirroring `pingap_performance::set_metrics_upstream_provider`.
pingap-upstream = { workspace = true }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
tokio-stream = { workspace = true, features = ["sync"] }
# "rc" adds serde impls for Arc, so the rule cache can store sites as
# `Arc<SiteRules>` and still persist the same JSON shape.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
prost-types = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
# CRC32 of the persisted sites snapshot, checked against metadata.json on load
# so a torn or corrupted snapshot is detected instead of silently parsed.
crc32fast = { workspace = true }
# Jitters the reconnect backoff so a fleet of agents never retries in lockstep.
rand = { workspace = true }
# CIDR matching for control-plane block commands that target a whole range.
ipnet = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
