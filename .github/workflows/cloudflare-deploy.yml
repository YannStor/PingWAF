name: Deploy site to Cloudflare (manual)

# Cloudflare Workers Builds is the primary deployment path: the GitHub
# integration builds `site/` and runs `wrangler deploy` (static assets from
# `wrangler.toml`) on every push, so nothing here runs automatically. This
# workflow is a manual fallback only — repository unreachable from Cloudflare,
# or a rebuild of an older commit — and needs the `CLOUDFLARE_API_TOKEN`
# (Workers Scripts: Edit) / `CLOUDFLARE_ACCOUNT_ID` secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Check content contract
        working-directory: site
        run: npm run check:content

      - name: Build
        working-directory: site
        run: npm run build

      - name: Check links and assets
        working-directory: site
        run: npm run check:links

      # Requires two repository secrets:
      #   CLOUDFLARE_API_TOKEN  — token with "Workers Scripts: Edit"
      #   CLOUDFLARE_ACCOUNT_ID — account id from the dashboard URL
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
