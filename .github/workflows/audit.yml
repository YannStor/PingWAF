name: Security Audit

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    permissions:
      contents: read # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-audit (not rustsec/audit-check): the CLI honours the advisory
      # ignore list in .cargo/audit.toml, where every accepted finding carries
      # a justification and an unblock condition. audit-check reads no config,
      # so it re-opened the same unmaintained-dependency issue every day even
      # after the finding was accepted here.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
