name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Check content contract
        working-directory: site
        run: npm run check:content

      - name: Build
        working-directory: site
        run: npm run build

      - name: Check links and assets
        working-directory: site
        run: npm run check:links

      # Requires two repository secrets:
      #   CLOUDFLARE_API_TOKEN  — "Cloudflare Pages: Edit" scoped token
      #   CLOUDFLARE_ACCOUNT_ID — account id from the dashboard URL
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=pingwaf
            --branch=${{ github.ref_name }}
