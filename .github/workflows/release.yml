name: Release

# Tag-triggered release pipeline.
#
#   trigger: push of a `v*` tag (e.g. v0.14.3)
#
# It produces the tarballs install.sh downloads, named EXACTLY:
#   pingwaf-linux-amd64.tar.gz   pingwaf-linux-arm64.tar.gz
# install.sh resolves the asset as `pingwaf-${OS}-${ARCH}.tar.gz` from
#   https://github.com/shuaiZend/PingWAF/releases/download/v${VERSION}/<asset>
# so these names must not drift. Each tarball also ships a `.sha256` checksum.
#
# Releases are Linux-only (server deployments). Both matrix legs use the
# default OpenSSL backend, matching the Dockerfile.

on:
  push:
    tags:
      - "v*"

# Never cancel a half-finished release: a partial asset set is worse than a slow
# complete one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build ${{ matrix.plat }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: write # create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux
            arch: amd64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "--features tracing"
          - plat: linux
            arch: arm64
            # ubuntu-22.04-arm ships protoc 3.12, which rejects proto3 optional
            # fields used by control_plane.proto; 24.04 has protoc >= 3.15.
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: "--features tracing"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The released binary embeds the dashboard, so build the real bundle
      # before cargo (rust-embed reads ../web/dist at compile time).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # SYNC: keep this list in lockstep with Dockerfile / ci.yml
          # NOTE: these binaries enable mimalloc unconditionally (see
          # src/main.rs). The Dockerfiles pin MIMALLOC_* defaults as ENV —
          # if you change them there, mirror the change in the tarball README
          # so bare-process deployments don't silently diverge.
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            libclang-dev \
            pkg-config \
            libssl-dev \
            nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # build.rs needs protoc; resolve whatever the package manager put on PATH.
      - name: Export PROTOC
        shell: bash
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Build pingwaf
        shell: bash
        run: |
          cargo build --release --bin pingwaf ${{ matrix.features }} --target ${{ matrix.target }}
          ls -lh "target/${{ matrix.target }}/release/pingwaf"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingwaf-binary-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/pingwaf
          retention-days: 1

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ASSET="pingwaf-${{ matrix.plat }}-${{ matrix.arch }}"
          STAGE="$ASSET"
          rm -rf "$STAGE" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/pingwaf" "$STAGE/pingwaf"
          cp LICENSE README.md "$STAGE/"
          # Optional extras: shipped when present, never fatal when absent.
          cp pingwaf.toml "$STAGE/" 2>/dev/null || true
          cp pingwaf.service "$STAGE/" 2>/dev/null || true
          chmod +x "$STAGE/pingwaf"
          tar -czf "$ASSET.tar.gz" "$STAGE"
          shasum -a 256 "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
          ls -lh "$ASSET.tar.gz" "$ASSET.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            pingwaf-${{ matrix.plat }}-${{ matrix.arch }}.tar.gz
            pingwaf-${{ matrix.plat }}-${{ matrix.arch }}.tar.gz.sha256

  docker:
    name: Docker image (${{ matrix.arch }})
    needs: binaries
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: pingwaf-binary-${{ matrix.arch }}
          path: docker-context/

      - name: Prepare build context
        run: |
          chmod +x docker-context/pingwaf
          cp pingwaf.toml docker-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GHA runners intermittently time out pulling moby/buildkit from
          # Docker Hub; mirror.gcr.io serves the identical image anonymously.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context/
          file: ./Dockerfile.runtime
          platforms: ${{ matrix.platform }}
          push: true
          # Disable provenance/SBOM so each per-arch tag is a plain image
          # manifest (not a manifest list), which docker manifest create requires.
          provenance: false
          sbom: false
          tags: ghcr.io/shuaizend/pingwaf:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}

  docker-manifest:
    name: Merge multi-arch Docker manifest
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/shuaizend/pingwaf"
          # Derive major.minor from version (e.g. 0.14.3 -> 0.14)
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)

          for tag in "$VERSION" "$MAJOR_MINOR" "latest"; do
            docker manifest create "${IMAGE}:${tag}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64" \
              --amend
            docker manifest push "${IMAGE}:${tag}"
          done
