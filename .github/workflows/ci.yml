name: CI

# Continuous integration for the PingWAF workspace.
#
#   - push to `main`  -> full gate (rust matrix + rustls + web + docker)
#   - pull_request    -> rust matrix + rustls + web (docker only runs on main)
#
# The `rust` job runs the test suite on three toolchains - the MSRV (1.96.0),
# 1.97.0 and stable - against the default OpenSSL backend and the `full`
# feature set (the configuration the release pipeline and the Dockerfile use).
# Formatting, clippy (whose MSRV is enforced via clippy.toml), the release
# build and typos run once, on stable. The `rustls` job exercises the
# alternative TLS backend with the same clippy gate and the full test suite -
# the CI equivalents of `make lint-rustls` / `make test-rustls`.
# `--all-features` is deliberately NOT used anywhere: `openssl` and
# `tls-rustls` are mutually exclusive TLS backends and enabling both fails to
# link, which is why the backends live in separate jobs with separate caches.

on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only the docker job needs to push to GHCR.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} (test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.96.0", "1.97.0", stable]
    env:
      # pingwaf-proto/build.rs honours PROTOC; point it at the apt-installed
      # protoc so the tonic/prost gRPC stubs are generated instead of the empty
      # placeholder build.rs writes when protoc is missing.
      PROTOC: /usr/bin/protoc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # SYNC: keep this list in lockstep with Dockerfile / release.yml
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            libclang-dev \
            pkg-config \
            libssl-dev \
            nasm

      - name: Install Rust toolchain
        # Expressions are not allowed in a step-level `uses:` ref, so the
        # action ref stays fixed and the toolchain arrives via the input.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # Lint components are only *used* on the stable leg (fmt/clippy run
          # there); installing them on the pinned legs is harmless, whereas a
          # conditional here would make those legs fall back to the runner's
          # default toolchain and silently void the MSRV matrix.
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # One cache per toolchain: a shared one would thrash between the
          # three matrix legs' differing metadata.
          key: ${{ matrix.toolchain }}

      # pingwaf-server embeds ../web/dist/ at compile time via rust-embed. The
      # folder has to exist for the crate to build; the `web` job below verifies
      # the real bundle, so an empty placeholder is enough here.
      - name: Ensure embedded frontend directory exists
        run: mkdir -p web/dist

      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --features full -- -D warnings

      # Release build feeds the :main Docker image (see the docker job below).
      # PRs skip it entirely: clippy + test already cover compile correctness,
      # and release-profile risk is exercised by every main push + release.yml.
      # The binary must embed the REAL dashboard (rust-embed reads ../web/dist
      # at compile time), so the frontend is built here on main pushes —
      # feature parity with the old Dockerfile source build (--features full).
      - name: Setup Node (release binary dashboard)
        if: matrix.toolchain == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (release binary dashboard)
        if: matrix.toolchain == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build (release, pingwaf, full)
        if: matrix.toolchain == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --release --bin pingwaf --features full

      - name: Upload release binary for :main image
        if: matrix.toolchain == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pingwaf-main-binary
          path: target/release/pingwaf
          retention-days: 1

      - name: Test (workspace)
        run: cargo test --workspace --features full --no-fail-fast

      - name: Typos
        if: matrix.toolchain == 'stable' && always()
        uses: crate-ci/typos@v1.51.1

  # The alternative TLS backend gets the same clippy gate and the full test
  # suite, in its own job: `openssl` and `tls-rustls` are mutually exclusive
  # features, so sharing a cache with the openssl matrix would thrash.
  rustls:
    name: Rust rustls backend (clippy / test)
    runs-on: ubuntu-latest
    env:
      PROTOC: /usr/bin/protoc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # SYNC: keep this list in lockstep with Dockerfile / release.yml
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            libclang-dev \
            pkg-config \
            libssl-dev \
            nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: rustls

      - name: Ensure embedded frontend directory exists
        run: mkdir -p web/dist

      - name: Clippy (rustls backend)
        run: cargo clippy --no-default-features --features=tls-rustls,full --all-targets --all -- --deny=warnings

      - name: Test (workspace, rustls backend)
        run: cargo test --workspace --no-default-features --features=tls-rustls,full --no-fail-fast

  web:
    name: Web (lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Static consistency checks for docs and agent prompts (frontmatter, model
  # names, cross references, relative links). Pure bash, no toolchain, so it
  # adds seconds, not minutes, to a PR run.
  docs:
    name: Docs & agent prompts (static checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .codebuddy/ holds IDE-session data (plans, agent prompts, rules) and is
      # local-only by design — see .gitignore and scripts/hooks/pre-commit.
      # Fail loudly if it ever sneaks back into the index.
      - name: Guard — .codebuddy must not be tracked
        run: |
          if [ -n "$(git ls-files .codebuddy)" ]; then
            echo "::error::.codebuddy/ is local-only and must never be committed:"
            git ls-files .codebuddy
            exit 1
          fi

      - name: Check docs & agent prompts
        run: ./scripts/check-docs-prompts.sh

  # Packs the :main snapshot image from the release binary built by the
  # `rust` job's stable leg (Dockerfile.runtime, same pattern as release.yml)
  # instead of rebuilding everything from source in-container — that rebuild
  # was the push-main critical path (~800s on its own). Only on main: a PR
  # run would burn a lot of minutes for little signal. The :latest tag
  # belongs to the release pipeline, which publishes a multi-arch manifest —
  # tagging it here would clobber that.
  docker:
    name: Docker build & push :main
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: pingwaf-main-binary
          path: docker-context/

      - name: Prepare build context
        run: |
          chmod +x docker-context/pingwaf
          cp pingwaf.toml docker-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GHA runners intermittently time out pulling moby/buildkit from
          # Docker Hub (same flakiness as the 429s that moved the base
          # images to public.ecr.aws); mirror.gcr.io serves the identical
          # image anonymously.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker-context/
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shuaizend/pingwaf:main
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
