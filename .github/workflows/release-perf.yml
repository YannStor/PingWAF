name: Release (perf image)

# On-demand symbol-preserving build for profiling.
#
#   trigger: workflow_dispatch ("Run workflow" button)
#   output:  ghcr.io/shuaizend/pingwaf:perf (amd64 only)
#
# The image is built with `--profile release-perf` (Dockerfile.perf): debug
# info kept, no stripping, so pprof CPU samples and flamegraphs symbolicate
# to real function names instead of addresses. It is 2-4× larger than the
# regular release image and is therefore NOT part of the version manifests —
# deploy it temporarily, capture a profile, then switch back.
#
# Runs on dispatch only: it never blocks main-line CI and does not double
# the per-arch image set on every release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: perf)"
        required: false
        default: "perf"

concurrency:
  group: release-perf
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  perf-image:
    name: Docker perf image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # GHA runners intermittently time out pulling moby/buildkit from
          # Docker Hub; mirror.gcr.io serves the identical image anonymously.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.perf
          platforms: linux/amd64
          push: true
          # Single-arch on purpose: the perf image is a temporary debugging
          # instrument, not a shipping artifact — no manifest merging, no
          # arm64 doubling.
          provenance: false
          sbom: false
          # Cache the (large) dependency layers across dispatches; the
          # release-perf profile artifacts live in target/release-perf/.
          cache-from: type=gha,scope=perf
          cache-to: type=gha,scope=perf,mode=max
          tags: ghcr.io/shuaizend/pingwaf:${{ inputs.tag || 'perf' }}
          labels: |
            org.opencontainers.image.title=PingWAF (perf, symbols kept)
            org.opencontainers.image.description=On-demand profiling build; profiles taken from it symbolicate. Not a production artifact.
            org.opencontainers.image.revision=${{ github.sha }}
