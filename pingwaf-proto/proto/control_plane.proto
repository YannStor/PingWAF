syntax = "proto3";
package pingwaf;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ============================================================
// Service Definition
// ============================================================

service ControlPlane {
  // Agent lifecycle
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc Heartbeat(stream AgentHeartbeat) returns (stream ServerCommand);

  // Rule synchronization (server pushes rules to agent)
  rpc SyncRules(SyncRulesRequest) returns (stream RuleBundle);

  // Log shipping (agent streams logs to server)
  rpc ShipLogs(stream LogEntry) returns (LogAck);

  // Certificate event shipping (raw ACME issuance logs from the agent)
  rpc ShipCertEvents(stream CertEventEntry) returns (CertEventAck);

  // Metrics shipping
  rpc ShipMetrics(stream MetricBatch) returns (MetricAck);

  // Configuration sync (agent pulls full site config)
  rpc GetSiteConfig(GetSiteConfigRequest) returns (SiteConfig);
}

// ============================================================
// Agent Registration & Heartbeat
// ============================================================

message RegisterAgentRequest {
  string api_key = 1;
  string hostname = 2;
  string ip_address = 3;   // Primary address the control plane should dial
  string version = 4;
  string os_info = 5;
  uint32 cpu_cores = 6;
  uint64 memory_bytes = 7;
  // Egress address as seen by the public internet, empty when unknown.
  string public_ip = 8;
  // First non-virtual LAN address (docker/veth/bridge and loopback excluded).
  string private_ip = 9;
}

message RegisterAgentResponse {
  string agent_id = 1;
  string agent_token = 2;  // JWT for subsequent communication
  int64 heartbeat_interval_seconds = 3;
  SiteConfig initial_config = 4;
}

message AgentHeartbeat {
  string agent_id = 1;
  string agent_token = 2;
  google.protobuf.Timestamp timestamp = 3;

  // Runtime metrics
  double cpu_usage_percent = 4;
  uint64 memory_usage_bytes = 5;
  uint64 active_connections = 6;
  uint64 requests_per_second = 7;
  uint64 blocked_requests_total = 8;

  // Status
  AgentHealthStatus health = 9;
  string config_hash = 10;  // Current running config hash
  repeated SiteStatus site_statuses = 11;

  // Host probe samples collected since the previous heartbeat (oldest first).
  repeated HostSample host_samples = 12;
  string public_ip = 13;
  string private_ip = 14;

  // Dynamic IP blocks currently enforced by this agent: server-issued
  // block commands plus auto-blocks triggered by WAF/rate-limit verdicts.
  // The control plane reconciles its copy of the list against this report.
  repeated BlockedIp blocked_ips = 15;

  // When the agent last applied a full site config / a per-site rule
  // bundle from the control plane. Absent = never synced.
  google.protobuf.Timestamp last_config_sync_at = 16;
  google.protobuf.Timestamp last_policy_sync_at = 17;

  // Rule-cache disk health: false = no usable snapshot could be loaded, so
  // the agent runs on empty rules until the next sync; true with a non-empty
  // `cache_status_reason` = the backup snapshot was restored. Absent on
  // older agents — the control plane treats that as healthy.
  optional bool cache_persist_healthy = 18;
  string cache_status_reason = 19;

  // Per-upstream backend health as seen by this agent's load balancer
  // (circuit-breaker state, not an active probe). The control plane turns
  // sustained all-backends-down into `site.upstream_offline` alerts and
  // partial loss into `site.upstream_abnormal`. Absent on older agents.
  repeated UpstreamHealth upstream_health = 20;
}

// Backend health of one upstream, reported per heartbeat.
message UpstreamHealth {
  string upstream_name = 1;      // Upstream name as configured
  uint32 healthy_backends = 2;    // Backends currently passing health checks
  uint32 total_backends = 3;     // All configured backends
  repeated string unhealthy_backends = 4;  // Backend addresses currently failing
}

// One dynamically blocked IP as enforced at the edge.
message BlockedIp {
  string ip = 1;
  string site_id = 2;
  string reason = 3;
  google.protobuf.Timestamp blocked_at = 4;
  // Absent = permanent block (no automatic expiry).
  google.protobuf.Timestamp expires_at = 5;
}

enum AgentHealthStatus {
  AGENT_HEALTH_UNKNOWN = 0;
  AGENT_HEALTH_HEALTHY = 1;
  AGENT_HEALTH_DEGRADED = 2;
  AGENT_HEALTH_UNHEALTHY = 3;
}

message SiteStatus {
  string site_id = 1;
  string domain = 2;
  uint64 requests_total = 3;
  uint64 requests_blocked = 4;
  uint64 cache_hits = 5;
  uint64 cache_misses = 6;
  string ssl_status = 7;  // "valid", "expiring_soon", "expired", "none"
  google.protobuf.Timestamp ssl_expires_at = 8;

  // Edge cache disk accounting, reported by the agent's quota ledger.
  uint64 cache_disk_bytes = 9;    // Current on-disk usage for this site
  uint64 cache_items = 10;        // Tracked cache entries
  uint64 cache_evictions = 11;    // Entries evicted to stay under quota
  uint64 cache_quota_bytes = 12;  // Configured ceiling, 0 = unlimited
}

// One host probe sample, taken every few seconds by the agent's probe thread.
// Cumulative counters (net/disk) are shipped raw and differenced by consumers.
message HostSample {
  int64 ts_millis = 1;                 // Unix epoch milliseconds
  double cpu_usage_percent = 2;
  double load1 = 3;
  double load5 = 4;
  double load15 = 5;
  uint64 memory_total_bytes = 6;
  uint64 memory_used_bytes = 7;
  uint64 memory_available_bytes = 8;
  uint64 swap_total_bytes = 9;
  uint64 swap_used_bytes = 10;
  uint64 disk_total_bytes = 11;        // Filesystem holding the probe path
  uint64 disk_used_bytes = 12;
  uint64 net_rx_bytes = 13;
  uint64 net_tx_bytes = 14;
  uint64 disk_read_bytes = 15;
  uint64 disk_write_bytes = 16;
  uint32 process_count = 17;
  uint32 tcp_connections = 18;
  uint64 uptime_secs = 19;
}

message ServerCommand {
  string command_id = 1;
  CommandType type = 2;
  google.protobuf.Timestamp issued_at = 3;

  oneof payload {
    RuleUpdateCommand rule_update = 10;
    ConfigReloadCommand config_reload = 11;
    BlockIpCommand block_ip = 12;
    UnblockIpCommand unblock_ip = 13;
    PurgeCacheCommand purge_cache = 14;
    UpdateSiteCommand update_site = 15;
    RestartAgentCommand restart_agent = 16;
  }
}

enum CommandType {
  COMMAND_UNKNOWN = 0;
  COMMAND_RULE_UPDATE = 1;
  COMMAND_CONFIG_RELOAD = 2;
  COMMAND_BLOCK_IP = 3;
  COMMAND_UNBLOCK_IP = 4;
  COMMAND_PURGE_CACHE = 5;
  COMMAND_UPDATE_SITE = 6;
  COMMAND_RESTART_AGENT = 7;
}

message RuleUpdateCommand {
  string site_id = 1;
  RuleBundle rules = 2;
}

message ConfigReloadCommand {
  SiteConfig config = 1;
}

message BlockIpCommand {
  string site_id = 1;
  repeated string ip_addresses = 2;
  int64 duration_seconds = 3;  // 0 = permanent
  string reason = 4;
}

message UnblockIpCommand {
  string site_id = 1;
  repeated string ip_addresses = 2;
}

message PurgeCacheCommand {
  string site_id = 1;
  repeated string urls = 2;      // Empty = purge all
  repeated string tags = 3;
}

message UpdateSiteCommand {
  SiteConfig site_config = 1;
}

message RestartAgentCommand {
  string reason = 1;
  bool graceful = 2;
}

// ============================================================
// Rule Synchronization
// ============================================================

message SyncRulesRequest {
  string agent_id = 1;
  string agent_token = 2;
  string site_id = 3;           // Empty = all sites
  string current_config_hash = 4; // For delta sync
}

message RuleBundle {
  string site_id = 1;
  string config_hash = 2;
  google.protobuf.Timestamp updated_at = 3;

  // WAF Rules
  WafConfig waf = 10;

  // Rate Limiting
  repeated RateLimitRule rate_limit_rules = 11;

  // IP Access Rules
  repeated IpAccessRule ip_access_rules = 12;

  // Geo Restrictions
  GeoConfig geo = 13;

  // Cache Rules
  repeated CacheRule cache_rules = 14;

  // Challenge Config
  ChallengeConfig challenge = 15;

  // Rewrite Rules
  repeated RewriteRule rewrite_rules = 16;

  // Custom Error Pages
  repeated CustomErrorPage error_pages = 17;

  // SSL Config
  SslConfig ssl = 18;

  // Upstream Config
  repeated UpstreamConfig upstreams = 19;

  // Origin pools and routes
  repeated RouteConfig routes = 20;

  // Bot protection (UA classification)
  BotProtectionConfig bot_protection = 21;

  // Site-wide basic authentication gate
  BasicAuthConfig basic_auth = 22;

  // Observation mode: every protection (WAF, IP/geo rules, bot protection,
  // rate limiting) keeps detecting but only records; the request proceeds.
  bool observation_mode = 23;

  // Per-site failover policy registry: every bundle carries the complete
  // domain → policy map for ALL sites, so the agent can resolve a site's
  // disconnected behaviour even for hosts whose rule bundle was never
  // synced (the only situation in which the policy is consulted).
  repeated SitePolicy site_policies = 24;

  // Control-plane-wide default for hosts absent from `site_policies`.
  // Explicit presence (`optional`): an old server leaves the field unset,
  // which the agent must distinguish from an explicit `false`.
  optional bool default_fail_open = 25;

  // Deployment-wide cache ceiling (single-file cap, total disk budget,
  // master switch, default edge TTL). Absent = old server: the agent falls
  // back to its built-in defaults.
  optional GlobalCacheSettings global_cache = 26;

  // Site-level cache limits (single-file cap + per-content-type caps).
  // Absent = no site-level override.
  optional SiteCacheSettings cache_settings = 27;

  // Deployment-wide default for verifying the TLS certificate of an origin
  // reached over HTTPS. Fills in the pools that carry no `verify_cert` of
  // their own (i.e. those that follow the default); a pool that states its
  // own value always wins. Explicit presence (`optional`): an old server
  // leaves it unset, which the agent must distinguish from an explicit
  // `false` — it then keeps its historical lenient behaviour, because
  // falling through to strict validation would 502 every HTTPS origin with
  // a self-signed certificate. See `BasicConf::origin_verify_cert`.
  optional bool origin_verify_cert = 28;
}

// Deployment-wide cache limits, mirrored from the `cache_settings` table.
message GlobalCacheSettings {
  // Largest single cacheable object, in megabytes (0 = old-server default
  // of 16 MiB applies).
  optional uint32 max_file_size_mb = 1;
  // Total disk budget across all sites, in megabytes; 0 = unlimited.
  optional uint32 max_space_mb = 2;
  // Master switch: false removes the cache plugin from the generated
  // configuration entirely.
  optional bool master_enabled = 3;
  // Edge TTL (seconds) used when a cache rule does not configure one;
  // 0 = no fallback.
  optional uint32 default_edge_ttl_seconds = 4;
}

// One content family of a site's extension-based cache type policy.
message CacheTypeCategory {
  // Whether this family's cache rule is active.
  optional bool enabled = 1;
  // Edge freshness seconds; an enabled family always carries a value > 0
  // (validated at write time).
  optional uint32 edge_ttl_seconds = 2;
  // Browser-facing Cache-Control max-age override; 0 = leave origin.
  optional uint32 browser_ttl_seconds = 3;
  // File extensions (lowercase, no dot) this family covers.
  repeated string extensions = 4;
}

// Extension-based cache policy: five fixed content families an
// administrator tunes per site.
message CacheTypePolicy {
  optional CacheTypeCategory web_assets = 1;
  optional CacheTypeCategory image = 2;
  optional CacheTypeCategory media = 3;
  optional CacheTypeCategory other = 4;
  optional CacheTypeCategory html = 5;
}

// One site's cache limits. Values the site did not set are absent and the
// consumer falls back: type limit → site cap → global cap.
message SiteCacheSettings {
  // Site-level single-file cap in megabytes; absent = follow the global
  // ceiling.
  optional uint32 max_file_size_mb = 1;
  // Per-content-type single-file caps keyed by
  // html/css/js/image/font/media/other.
  map<string, uint32> type_max_file_size_mb = 2;
  // Extension-based cache policy; absent when unconfigured.
  optional CacheTypePolicy type_policy = 3;
}

// How one site behaves while the control plane is unreachable and the host
// has no synced rule bundle.
enum FailoverMode {
  FAILOVER_INHERIT = 0;  // Follow `default_fail_open`
  FAILOVER_OPEN = 1;     // Keep proxying through the base engine
  FAILOVER_CLOSED = 2;   // Answer 503
}

// One site's entry in the failover policy registry.
message SitePolicy {
  string domain = 1;
  repeated string alternate_domains = 2;
  FailoverMode mode = 3;
}

// Site-wide HTTP basic authentication. Enforced by the WAF plugin, which sits
// at the head of the plugin chain, so a cache hit cannot bypass the gate.
message BasicAuthConfig {
  bool enabled = 1;
  // Realm announced in the `WWW-Authenticate` challenge.
  string realm = 2;
  // Accepted credentials. `authorization` is the base64 of `user:password`,
  // ready to compare against the request's Authorization header.
  repeated BasicAuthCredential credentials = 3;
  // Seconds to sleep after a failed attempt, slowing down brute force.
  uint32 delay_seconds = 4;
  // Strip the Authorization header before forwarding to the origin.
  bool hide_credentials = 5;
}

message BasicAuthCredential {
  string username = 1;
  string authorization = 2;
}

message WafConfig {
  bool enabled = 1;
  WafMode mode = 2;
  uint32 paranoia_level = 3;  // 1-4
  bool sqli_detection = 4;
  bool xss_detection = 5;
  bool rce_detection = 6;
  bool lfi_detection = 7;
  bool ssrf_detection = 8;
  bool bot_detection = 9;

  // Custom rules
  repeated WafRule custom_rules = 20;

  // Managed ruleset overrides
  repeated RuleOverride managed_overrides = 21;

  // ML config
  bool ml_enabled = 30;
  string ml_model_path = 31;
  double ml_threshold = 32;

  // Anomaly scoring
  uint32 anomaly_threshold = 40;

  // Site-level posture merged from the `waf_settings` row: advanced mode
  // (strict level + body deep inspection) and monitor-only downgrades.
  // Empty/false = enforce everything at the normal level (the default).
  bool advanced_mode = 41;
  repeated string monitor_categories = 42;  // "sqli"…"ssti"; unknown ignored
  repeated string monitor_stacks = 43;      // "java"|"php"|"python"|"node"
  // Individual managed rule ids (e.g. "PINGWAF-1010") downgraded to
  // monitor-only at this site. Unknown ids are ignored by the data plane.
  repeated string monitor_managed_rules = 44;

  // How long the data plane may withhold a request body while inspecting it
  // (seconds, 1-30). 0/unset means "use the data-plane default" (30). This is
  // a per-site WAF setting, not a downstream connection timeout: downstream
  // timeouts belong to the listener and cannot vary per host.
  uint32 body_stage_timeout_secs = 45;
}

enum WafMode {
  WAF_MODE_OFF = 0;
  WAF_MODE_MONITOR = 1;  // Log only
  WAF_MODE_BLOCK = 2;    // Block threats
}

message WafRule {
  string id = 1;
  string name = 2;
  string description = 3;
  string expression = 4;       // Rules language expression
  WafAction action = 5;
  uint32 severity = 6;         // 1-5
  repeated string tags = 7;
  bool enabled = 8;
  WafMode mode = 9;
  uint32 priority = 10;
}

enum WafAction {
  WAF_ACTION_BLOCK = 0;
  WAF_ACTION_LOG = 1;
  WAF_ACTION_CHALLENGE = 2;
  WAF_ACTION_JS_CHALLENGE = 3;
  WAF_ACTION_ALLOW = 4;
  // Require basic authentication for the matched request. Only meaningful in
  // the geo rule's action: custom WAF rules cannot express it.
  WAF_ACTION_BASIC_AUTH = 5;
}

message RuleOverride {
  string rule_id = 1;
  string tag = 2;              // Override by tag (if rule_id empty)
  WafAction action = 3;
  bool enabled = 4;
}

message RateLimitRule {
  string id = 1;
  string name = 2;
  string expression = 3;       // Match condition
  repeated RateLimitCharacteristics characteristics = 4;
  uint32 period_seconds = 5;
  uint32 threshold = 6;
  WafAction action = 7;
  uint32 mitigation_timeout_seconds = 8;
  bool enabled = 9;
  uint32 priority = 10;
  // Parameter name (header name, cookie name or query parameter name) for the
  // characteristic at the matching index; only HEADER/COOKIE/QUERY carry one
  // (e.g. "X-Api-Key", "session", "token"), every other index stays empty.
  repeated string characteristic_params = 11;
}

enum RateLimitCharacteristics {
  RATE_LIMIT_CHAR_IP = 0;
  RATE_LIMIT_CHAR_IP_NAT = 1;
  RATE_LIMIT_CHAR_HOST = 2;
  RATE_LIMIT_CHAR_PATH = 3;
  RATE_LIMIT_CHAR_HEADER = 4;
  RATE_LIMIT_CHAR_COOKIE = 5;
  RATE_LIMIT_CHAR_QUERY = 6;
  RATE_LIMIT_CHAR_ASN = 7;
  RATE_LIMIT_CHAR_COUNTRY = 8;
  RATE_LIMIT_CHAR_JA3 = 9;
}

message IpAccessRule {
  string id = 1;
  string name = 2;
  repeated string ip_ranges = 3;   // CIDR notation
  IpAccessAction action = 4;
  string note = 5;
  bool enabled = 6;
}

enum IpAccessAction {
  IP_ACCESS_BLOCK = 0;
  IP_ACCESS_CHALLENGE = 1;
  IP_ACCESS_JS_CHALLENGE = 2;
  IP_ACCESS_ALLOW = 3;
  // Require basic authentication for the matched client.
  IP_ACCESS_BASIC_AUTH = 4;
}

message GeoConfig {
  bool enabled = 1;
  repeated string blocked_countries = 2;    // ISO 3166-1 alpha-2
  repeated string allowed_countries = 3;    // Whitelist mode
  repeated string blocked_asns = 4;
  bool block_unknown = 5;
  WafAction action = 6;
}

message CacheRule {
  string id = 1;
  string name = 2;
  string match_expression = 3;
  uint32 edge_ttl_seconds = 4;
  uint32 browser_ttl_seconds = 5;
  uint32 disk_quota_mb = 6;       // Per-domain disk cache limit
  bool cache_eligible = 7;
  repeated string cache_key_headers = 8;
  bool respect_origin_headers = 9;
  uint32 stale_while_revalidate_seconds = 10;
  bool enabled = 11;
}

message ChallengeConfig {
  bool enabled = 1;
  bool under_attack_mode = 2;
  ChallengeLevel default_level = 3;
  uint32 clearance_duration_seconds = 4;  // Cookie validity
  repeated string exempt_paths = 5;       // Paths that skip challenge

  // Trigger conditions
  uint32 request_threshold = 10;         // Requests per minute to trigger
  bool browser_integrity_check = 11;
  bool tls_fingerprint_check = 12;
}

enum ChallengeLevel {
  CHALLENGE_NONE = 0;
  CHALLENGE_NON_INTERACTIVE = 1;  // JS Challenge (5s shield)
  CHALLENGE_MANAGED = 2;          // System decides
  CHALLENGE_INTERACTIVE = 3;      // Full CAPTCHA
}

// User-agent based bot classification. Verified bots on the whitelist pass,
// real browsers pass, everything else receives the configured action.
message BotProtectionConfig {
  bool enabled = 1;
  WafAction action = 2;                      // Applied to non-browser user agents
  repeated string known_bots_whitelist = 3;  // Case-insensitive UA substrings of verified bots
  // Verify claiming bots by their client IP: a request whose IP falls inside
  // `verified_bot_ranges` is treated as a verified bot regardless of its UA.
  bool ip_verification_enabled = 4;
  // Confirm whitelisted bot user agents via reverse DNS (PTR must resolve
  // back to a known bot domain that also points at the client IP).
  bool dns_verification_enabled = 5;
  // CIDR ranges of verified bot networks, expanded by the control plane from
  // the IP group the site's bot protection references (the agent never sees
  // group identities).
  repeated string verified_bot_ranges = 6;
}

message RewriteRule {
  string id = 1;
  string name = 2;
  string match_expression = 3;
  RewriteDirection direction = 4;
  reserved 5, 6, 7, 8, 9, 10;
  reserved "header_operations", "path_rewrite", "path_rewrite_to",
            "query_rewrite", "body_search", "body_replace";
  bool enabled = 11;
  uint32 priority = 12;
  repeated RewriteOperation operations = 13;
}

enum RewriteDirection {
  REWRITE_REQUEST = 0;
  REWRITE_RESPONSE = 1;
}

// One declarative rewrite operation, mirroring the console's operations JSON:
// type is one of set_header | add_header | remove_header | set_path |
// regex_replace_path | set_query_param | remove_query_param | replace_body.
// name/value semantics depend on the type (pattern/replacement for
// regex_replace_path and replace_body, header name/value for header ops).
message RewriteOperation {
  string type = 1;
  string name = 2;
  string value = 3;
}

message CustomErrorPage {
  string id = 1;
  uint32 status_code = 2;         // 403, 429, 502, etc.
  string content_type = 3;        // "text/html", "application/json", "text/plain"
  string body_template = 4;       // Tera template
  string name = 5;
  bool enabled = 6;
}

message SslConfig {
  string cert_pem = 1;
  string key_pem = 2;
  bool acme_enabled = 3;
  string acme_email = 4;
  AcmeChallengeType acme_challenge_type = 5;
  string acme_dns_provider = 6;
  map<string, string> acme_dns_config = 7;
  string min_tls_version = 8;
  bool hsts_enabled = 9;
  uint32 hsts_max_age = 10;
  bool always_use_https = 11;
  // Whether the site serves HTTPS at all.
  bool enabled = 12;
  string max_tls_version = 13;
  // When set, the edge issues certificates on the fly instead of using
  // `cert_pem`/`key_pem`.
  bool self_signed = 14;
  bool mtls_enabled = 15;
  string mtls_client_ca = 16;
  // Id of the `site_certificates` row this posture selects, when any.
  string certificate_id = 17;
  // SHA-256 fingerprints (lowercase hex) of revoked client certificates; the
  // data plane rejects a handshake identity found here.
  repeated string mtls_revoked_fingerprints = 18;
  // Organization every client certificate must carry, so a certificate issued
  // for another site cannot be replayed here. Empty skips the check.
  string mtls_organization = 19;
  // Whether a client certificate is required at all; defaults to
  // `mtls_enabled` when unset for backward compatibility.
  bool mtls_require_client_cert = 20;
}

enum AcmeChallengeType {
  ACME_HTTP_01 = 0;
  ACME_DNS_01 = 1;
}

message UpstreamConfig {
  string name = 1;
  repeated UpstreamPeer peers = 2;
  LoadBalanceAlgorithm algorithm = 3;
  HealthCheckConfig health_check = 4;
  uint32 connection_timeout_ms = 5;
  uint32 read_timeout_ms = 6;
  uint32 write_timeout_ms = 7;

  // Origin pool identity and pingap-level settings. `algo` carries the
  // complete pingap LB spec (`round_robin` or `hash:<type>[:<key>]`) and
  // supersedes `algorithm`, which stays for backward compatibility.
  string pool_id = 8;
  string algo = 9;
  // Non-empty enables TLS to the origin and sets the SNI.
  string sni = 10;
  optional bool verify_cert = 11;
  bool is_default = 12;
}

message UpstreamPeer {
  string address = 1;    // host:port
  uint32 weight = 2;
  bool tls = 3;
}

// A path-based route directing matching requests to an origin pool.
message RouteConfig {
  string id = 1;
  string name = 2;
  // prefix | exact | regex
  string match_type = 3;
  // Raw path, no pingap marker; the data plane adds "=" / "~" as needed.
  string path = 4;
  // Manual location weight; unset uses pingap's auto weight.
  optional int32 priority = 5;
  bool enabled = 6;
  string pool_id = 7;
  // CIDR ranges the client IP must fall into for this route to match; empty
  // matches every client, entries come from the route's IP group.
  repeated string ip_ranges = 9;
}

enum LoadBalanceAlgorithm {
  LB_ROUND_ROBIN = 0;
  LB_CONSISTENT_HASH = 1;
  LB_LEAST_CONNECTIONS = 2;
  LB_RANDOM = 3;
}

message HealthCheckConfig {
  bool enabled = 1;
  string path = 2;
  uint32 interval_seconds = 3;
  uint32 timeout_ms = 4;
  uint32 unhealthy_threshold = 5;
  uint32 healthy_threshold = 6;
}

// ============================================================
// Site Configuration
// ============================================================

message GetSiteConfigRequest {
  string agent_id = 1;
  string agent_token = 2;
  string site_id = 3;  // Empty = all sites for this agent
}

message SiteConfig {
  repeated Site sites = 1;
  google.protobuf.Timestamp updated_at = 2;
  string config_hash = 3;
}

message Site {
  string id = 1;
  string name = 2;
  string domain = 3;
  repeated string alternate_domains = 4;
  SiteStatusEnum status = 5;
  RuleBundle rules = 6;
  // The site sits behind a CDN / reverse proxy: the real client IP used by
  // IP access control, rate limiting, challenges and logs is taken from a
  // forwarded header instead of the direct TCP peer.
  bool trust_proxy_headers = 7;
  // Lower-case header the client IP is read from; empty = x-forwarded-for.
  string trusted_header = 8;
  // Trust the last XFF entry (appended by the nearest proxy) instead of the
  // client-supplied first one.
  bool trust_last_hop = 9;
  // CIDR ranges of proxies allowed to influence the resolved client IP.
  // Only a direct peer inside one of these ranges may set the forwarded
  // header; an empty list means no proxy is trusted.
  repeated string trusted_proxy_ranges = 10;
}

enum SiteStatusEnum {
  SITE_STATUS_ACTIVE = 0;
  SITE_STATUS_PAUSED = 1;
  SITE_STATUS_PENDING = 2;
}

// ============================================================
// Logging
// ============================================================

message LogEntry {
  string agent_id = 1;
  string site_id = 2;
  string request_id = 3;
  google.protobuf.Timestamp timestamp = 4;

  // Request info
  string client_ip = 10;
  string method = 11;
  string scheme = 12;
  string host = 13;
  string path = 14;
  string query_string = 15;
  string protocol = 16;
  map<string, string> request_headers = 17;
  bytes request_body = 18;          // Truncated per config
  uint64 request_body_size = 19;    // Original size before truncation
  bool request_body_truncated = 20;

  // Response info
  uint32 response_status = 30;
  map<string, string> response_headers = 31;
  bytes response_body = 32;          // Truncated per config
  uint64 response_body_size = 33;
  bool response_body_truncated = 34;

  // Upstream info
  string upstream_addr = 40;
  uint64 upstream_latency_ms = 41;

  // WAF info
  uint32 waf_score = 50;
  string waf_action = 51;
  string waf_rule_id = 52;
  string waf_details = 53;
  repeated string waf_matched_tags = 54;
  string waf_rule_name = 55;        // Display name of the rule that fired
  // Which protection produced the event: "managed"|"waf"|"ip_geo"|"bot"|
  // "rate_limit"|"challenge". Drives dashboard deep links; empty on old data.
  string waf_event_type = 56;

  // Performance
  uint64 total_latency_ms = 60;
  string cache_status = 61;         // "hit", "miss", "bypass", "expired"

  // TLS
  string tls_version = 70;
  string ja3_hash = 71;

  // Geo
  string country_code = 80;
  string city = 81;
  uint32 asn = 82;

  // User agent
  string user_agent = 90;
  string referer = 91;
}

message LogAck {
  uint64 received_count = 1;
  bool success = 2;
  string error_message = 3;
}

// A raw certificate lifecycle log line captured on the agent (e.g. ACME
// issuance progress from the data plane), so admins can follow issuance
// attempts in the console.
message CertEventEntry {
  string agent_id = 1;
  string site_id = 2;             // Empty when unknown at emit time
  string certificate_id = 3;      // Empty when unknown at emit time
  string event_type = 4;          // e.g. "acme_raw"
  string level = 5;               // "INFO" / "WARN" / "ERROR"
  string target = 6;              // tracing target, e.g. "pingap::acme"
  string message = 7;             // Formatted log line
  google.protobuf.Timestamp timestamp = 8;
}

message CertEventAck {
  uint64 received_count = 1;
  bool success = 2;
  string error_message = 3;
}

// ============================================================
// Metrics
// ============================================================

message MetricBatch {
  string agent_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  repeated Metric metrics = 3;
}

message Metric {
  string name = 1;
  map<string, string> labels = 2;
  double value = 3;
  MetricType type = 4;
}

enum MetricType {
  METRIC_GAUGE = 0;
  METRIC_COUNTER = 1;
  METRIC_HISTOGRAM = 2;
}

message MetricAck {
  uint64 received_count = 1;
  bool success = 2;
}
