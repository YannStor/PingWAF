# The pingap history below the divider in CHANGELOG.md is inherited verbatim
# and must not be edited, so upstream wording and commit-hash fragments are
# mapped to themselves rather than "fixed".
[default.extend-identifiers]
ANDed = "ANDed"
LIKEs = "LIKEs"

[default.extend-words]
# pingora BError::esource() — method name, not "resource".
esource = "esource"
abd = "abd"
dbe = "dbe"
ded = "ded"
ede = "ede"
realod = "realod"
