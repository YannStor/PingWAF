# PingWAF Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Default: all-in-one mode (control plane + data plane in a single container).
# For distributed deployments, see the `pingwaf-agent` service below.
#
# Usage:
#   docker compose up -d
#   # Dashboard: https://localhost:9080 (self-signed certificate — upload a real
#   # one under Settings → Control plane HTTPS; set PINGWAF_TLS_ENABLED=false to
#   # serve plain HTTP instead)
#   # Default credentials: admin@pingwaf.local / pingwaf123

services:
  # ─── PingWAF All-in-One (control plane + data plane) ───────────────────────
  pingwaf:
    # Pin a released version for production (e.g. :0.23.0) — :latest tracks
    # the newest release; :main is the unstable amd64 snapshot of main.
    image: ghcr.io/shuaizend/pingwaf:${PINGWAF_TAG:-latest}
    # To build from source instead of pulling the pre-built image, uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: pingwaf
    # Stable across container recreation: the control plane re-registration
    # matches agents by hostname + API key, so a changing container-ID
    # hostname would register a fresh offline ghost on every redeploy.
    hostname: pingwaf
    ports:
      - "80:80"       # HTTP traffic (proxied)
      - "443:443"     # HTTPS traffic (proxied)
      - "9080:9080"   # Admin dashboard + REST API
      - "9090:9090"   # gRPC control plane (agents connect here)
    environment:
      - PINGWAF_DB_URL=postgres://pingwaf:${POSTGRES_PASSWORD:-pingwaf}@postgres:5432/pingwaf
      - PINGWAF_MODE=all-in-one
      # The placeholder is safe to keep: the control plane detects it and
      # persists a random JWT secret on first boot. Set JWT_SECRET to pin your
      # own instead.
      - PINGWAF_JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-32-chars}
      - PINGWAF_ADMIN_ADDR=0.0.0.0:9080
      - PINGWAF_GRPC_ADDR=0.0.0.0:9090
      - PINGWAF_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@pingwaf.local}
      - PINGWAF_ADMIN_PASSWORD=${ADMIN_PASSWORD:-pingwaf123}
      - PINGWAF_ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      # HTTPS for the dashboard (self-signed until a certificate is uploaded).
      # Add the hostname you reach the dashboard on so the generated pair covers
      # it: PINGWAF_TLS_SANS=waf.example.com
      - PINGWAF_TLS_ENABLED=${TLS_ENABLED:-true}
      - PINGWAF_HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-15}
      # Opt into the Let's Encrypt staging CA for tests only. Empty/unset keeps
      # production; never set this on a real deployment.
      - PINGAP_ACME_STAGING=${PINGAP_ACME_STAGING:-}
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn}
      # Elasticsearch (optional — uncomment to enable log shipping)
      # - PINGWAF_ES_ENABLED=true
      # - PINGWAF_ES_URLS=http://elasticsearch:9200
      # - PINGWAF_ES_INDEX_PREFIX=pingwaf
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pingwaf-data:/var/lib/pingwaf
      - pingwaf-certs:/etc/pingwaf/certs
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pingwaf-net

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pingwaf-postgres
    environment:
      - POSTGRES_USER=pingwaf
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pingwaf}
      - POSTGRES_DB=pingwaf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback by default so the database is unreachable from other hosts;
      # set POSTGRES_BIND=0.0.0.0 (with a strong POSTGRES_PASSWORD) to expose.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingwaf -d pingwaf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pingwaf-net

  # ─── PingWAF Agent (distributed mode example) ──────────────────────────────
  # Uncomment this service to run a separate data-plane agent that connects
  # to the control plane above. In this setup, change the pingwaf service's
  # PINGWAF_MODE to "server" (control plane only).
  #
  # pingwaf-agent:
  #   image: ghcr.io/shuaizend/pingwaf:${PINGWAF_TAG:-latest}
  #   # build:
  #   #   context: .
  #   #   dockerfile: Dockerfile
  #   container_name: pingwaf-agent
  #   entrypoint: ["pingwaf", "agent"]
  #   command:
  #     # The control plane serves gRPC over TLS by default (self-signed on
  #     # first boot). Use https:// and pin its certificate as the CA:
  #     - "--server-url=https://pingwaf:9090"
  #     # Download the control plane certificate (Settings → Control plane HTTPS
  #     # → download), mount it, and point this at it. Set grpc_tls_mode = "off"
  #     # on the control plane to serve plaintext instead (then revert to
  #     # --server-url=http://pingwaf:9090).
  #     - "--server-ca-cert=/etc/pingwaf/certs/grpc-ca.pem"
  #     - "--api-key=${AGENT_API_KEY:-}"
  #     - "--cache-dir=/var/lib/pingwaf/cache"
  #     - "--heartbeat-interval-secs=30"
  #     - "--fail-open=true"
  #   ports:
  #     - "8080:80"
  #     - "8443:443"
  #   environment:
  #     - RUST_LOG=${RUST_LOG:-info,sqlx=warn}
  #   depends_on:
  #     pingwaf:
  #       condition: service_healthy
  #   volumes:
  #     - agent-data:/var/lib/pingwaf
  #   restart: unless-stopped
  #   networks:
  #     - pingwaf-net

volumes:
  postgres-data:
    driver: local
  pingwaf-data:
    driver: local
  pingwaf-certs:
    driver: local
  # agent-data:
  #   driver: local

networks:
  pingwaf-net:
    driver: bridge
