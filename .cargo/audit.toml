# Configuration for cargo-audit / the security-audit CI job.

[advisories]
# Every entry here MUST say why it is ignored and what unblocks removing it.
ignore = [
    # derivative 2.2 (unmaintained, not a vulnerability). A proc-macro, so it
    # emits no runtime code and is absent from the shipped binary. A
    # non-optional dependency of pingora-core 0.9. Remove when pingora drops it.
    "RUSTSEC-2024-0388",

    # paste 1.0 (unmaintained, not a vulnerability). Also a proc-macro, also
    # absent from the binary. Reaches this tree only under the `imageoptim`
    # feature, through rav1e (ravif -> image), which still requires paste ^1.0
    # as of its latest release 0.8.1; dropping it would mean dropping avif
    # output. The `exr` path was removed by trimming image's default features.
    # Remove when rav1e moves to pastey or drops the dependency.
    "RUSTSEC-2024-0436",

    # rsa 0.9.10 (RUSTSEC-2023-0071, "Marvin" timing side-channel in PKCS#1 v1.5
    # decryption). No upstream fix exists yet. It reaches this tree only through
    # sqlx-mysql (MySQL caching_sha2_password authentication); this project uses
    # PostgreSQL, so that code path is never exercised.
    # Remove once rsa ships a constant-time fix.
    "RUSTSEC-2023-0071",

    # rustls-pemfile 2.2 (RUSTSEC-2025-0134) is unmaintained, not vulnerable.
    # It is required by Pingora 0.9's optional rustls backend; the current
    # upstream main branch still depends on it. Remove when Pingora replaces it.
    "RUSTSEC-2025-0134",

    # quick-xml 0.26 (RUSTSEC-2026-0194/0195, uncontrolled recursion and
    # potential XSS in untrusted documents). It reaches this tree through
    # pprof 0.15 -> inferno 0.11, and pprof pins inferno ^0.11, so there is no
    # semver-compatible upgrade. quick-xml is only used on the Linux pprof
    # flamegraph rendering path, parsing locally collected sampling data — it
    # never parses untrusted input. Remove once pprof allows inferno 0.12+.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # unsafe-libyaml 0.2.11 (RUSTSEC-2024-0449, unmaintained — the repo was
    # archived in March 2024, not a vulnerability). It is a non-optional
    # dependency of pingora-core 0.9 (via the deprecated serde_yaml 0.9, used
    # only for ServerConf YAML load/dump); upstream pingora master still
    # depends on serde_yaml 0.9, so there is nothing to upgrade to. The safe
    # forks (serde_norway et al.) rename the package, so they cannot be
    # substituted through [patch], which requires the same package name.
    # Exposure is limited: PingWAF's own configuration surface is
    # TOML/HCL/KDL, and the YAML path parses the operator's local config, not
    # network input. Remove when pingora drops serde_yaml.
    "RUSTSEC-2024-0449",

    # ruzstd 0.8.3 (RUSTSEC-2026-0344, decompression bomb: tiny input can
    # exhaust memory). The fixed 0.9.1 line is only pulled by object 0.40,
    # but pyroscope 2.1.1 — the latest release, and the sole path by which
    # object reaches this tree (pingap-pyroscope profiling) — pins object
    # ^0.39, which requires ruzstd ^0.8.1, so there is no semver-compatible
    # upgrade. Exposure is limited: object uses ruzstd to decode compressed
    # debug sections of local binaries while resolving profiling symbols —
    # the input is the host's own executable, never attacker-controlled
    # network data. Remove when pyroscope allows object 0.40+.
    "RUSTSEC-2026-0344",

    # webpki-roots 0.26.11 (RUSTSEC-2026-0381, the bundled root set still
    # trusts distrusted emSign intermediates). The 1.x copy in this tree is
    # already 1.0.10 (patched); 0.26 has no patched release — the line ends at
    # 0.26.11. Two dependencies still pull 0.26:
    #   * sqlx-core 0.8 (`_tls-rustls-ring-webpki`, via sea-orm 1.1). It is
    #     consulted only when `sslmode=verify-ca|verify-full` is set; the
    #     default `Prefer` path negotiates TLS but verifies with
    #     sqlx's DummyTlsVerifier, so the bundle never decides trust there.
    #   * sentry 0.36 (`webpki-roots` feature, reached through
    #     `pingora/sentry` under the `tracing` feature).
    # 0.26.11's root data is re-exported from webpki-roots 1.0.10 (a
    # `webpki-roots 0.26.11 -> webpki-roots 1.0.10` dependency edge in
    # Cargo.lock), so the runtime set is the patched one; cargo-audit matches
    # on package name and version only. Remove when sea-orm moves to sqlx 0.9
    # (sea-orm 2) AND pingora ships a sentry release that uses 1.x.
    "RUSTSEC-2026-0381",
]
