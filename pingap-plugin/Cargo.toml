[package]
name = "pingap-plugin"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "plugin"]
description = "Plugin for pingap"


[lib]
name = "pingap_plugin"
path = "src/lib.rs"

[features]
geo = []
# TLS backend, mirrored from the workspace root convention: exactly one of
# `openssl` (default) and `tls-rustls` must be on. The plugin itself needs
# no TLS stack; the passthrough exists so the agent dependency (and through
# it pingap-upstream) compiles in standalone `-p pingap-plugin` builds.
# Workspace builds strip this default and enable exactly one backend via
# the root's own feature chain.
default = ["openssl"]
openssl = ["pingwaf-agent/openssl"]
tls-rustls = ["pingwaf-agent/tls-rustls"]

[dependencies]
# 0.46's MSRV is 1.91; pingap's floor is 1.96 so this is fine.
tor-geoip = { workspace = true }
ahash = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bstr = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
cookie = { workspace = true }
ctor = { workspace = true }
crc32fast = { workspace = true }
dashmap = { workspace = true }
fancy-regex = { workspace = true }
glob = { workspace = true }
hex = { workspace = true }
hickory-resolver = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
jsonwebtoken = { workspace = true }
hmac-sha256 = { workspace = true }
hmac-sha512 = { workspace = true, default-features = false }
humantime = { workspace = true }
mime_guess = { workspace = true }
nanoid = { workspace = true }
path-absolutize = { workspace = true }
pingap-cache = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-util = { workspace = true }
pingwaf-waf = { path = "../pingwaf-waf" }
pingwaf-challenge = { path = "../pingwaf-challenge" }
# `default-features = false` keeps the TLS backend exclusive: the agent's
# default forwards openssl to pingap-upstream, which must never unify with
# a rustls build of the workspace (the two pingora backends are mutually
# exclusive). The binary's feature chain enables exactly one backend.
pingwaf-agent = { path = "../pingwaf-agent", default-features = false }
pingora = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
snafu = { workspace = true }
substring = { workspace = true }
tera = { workspace = true }
TinyUFO = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }


[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
# Rule bundles are pushed to the test agent through the proto types.
pingwaf-proto = { path = "../pingwaf-proto" }
# Enables the test-util feature (agent instance installer + log introspection)
# for the waf plugin access-log tests. Default features stay off for the
# same TLS-backend exclusivity as the regular dependency above.
pingwaf-agent = { path = "../pingwaf-agent", default-features = false, features = ["test-util"] }

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
