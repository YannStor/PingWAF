# Cloudflare Workers configuration for the portal: a Worker that serves static
# assets only (no script). The project is connected to GitHub through Workers
# Builds, which runs `npm run build` in `site/` and then `npx wrangler deploy`.
#
# `name` must match the Cloudflare project name.
name = "pingwaf"
compatibility_date = "2026-10-01"

[assets]
# Relative to this file, so workers builds and local runs both resolve it.
directory = "./dist"
# Serve the branded page emitted by `src/pages/404.astro`.
not_found_handling = "404-page"
